
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StolenChecker.KZ</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Inter,sans-serif;
background:
radial-gradient(circle at top left,rgba(0,140,255,.35),transparent 35%),
radial-gradient(circle at bottom right,rgba(0,80,255,.25),transparent 35%),
#050b17;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
color:white;
}

.grid{
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
background-size:42px 42px;
animation:move 15s linear infinite;
}

@keyframes move {
0%{transform:translateY(0px)}
100%{transform:translateY(42px)}
}

.card{
position:relative;
z-index:2;
width:95%;
max-width:760px;
background:rgba(12,22,42,.88);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-radius:34px;
padding:42px;
box-shadow:0 0 60px rgba(0,120,255,.22);
}

.logo{
font-size:46px;
font-weight:800;
margin-bottom:8px;
}

.subtitle{
color:#8fb7ff;
font-size:18px;
margin-bottom:28px;
}

.badge{
display:inline-block;
padding:10px 16px;
background:#102543;
border-radius:999px;
color:#7fb8ff;
font-size:13px;
margin-bottom:20px;
}

.block{
background:rgba(255,255,255,.03);
border-radius:24px;
padding:24px;
margin-bottom:22px;
}

input{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#0d1b33;
color:white;
font-size:17px;
margin-top:16px;
outline:none;
}

button{
width:100%;
padding:18px;
margin-top:16px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#1178ff,#00c6ff);
color:white;
font-size:18px;
font-weight:800;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:translateY(-2px) scale(1.01);
box-shadow:0 10px 30px rgba(0,140,255,.35);
}

.hidden{
display:none;
}

.result{
display:none;
margin-top:20px;
padding:24px;
border-radius:22px;
font-size:18px;
line-height:1.7;
}

.good{
background:rgba(0,255,170,.08);
border:1px solid rgba(0,255,170,.25);
}

.bad{
background:rgba(255,0,90,.08);
border:1px solid rgba(255,0,90,.25);
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="card">

<div class="badge">SECURE ACCESS • STOLENCHECKER.KZ</div>

<div class="logo">StolenChecker.KZ</div>

<div class="subtitle">
Проверка устройств по базе украденных IMEI
</div>

<div id="auth" class="block">

<h2>Введите код доступа</h2>

<input id="codeInput" placeholder="6-значный код">

<button onclick="unlock()">Разблокировать систему</button>

</div>

<div id="panel" class="hidden">

<div class="block">

<h2>Проверка IMEI</h2>

<input id="imeiInput" placeholder="Введите IMEI телефона">

<button onclick="checkIMEI()">Проверить устройство</button>

<div id="result" class="result"></div>

</div>

</div>

function unlock(){
const code = document.getElementById("codeInput").value.trim();

if(ACCESS_CODES.includes(code)){
document.getElementById("auth").style.display = "none";
document.getElementById("panel").classList.remove("hidden");
} else {
alert("Неверный код доступа");
}
}

function checkIMEI(){
const imei = document.getElementById("imeiInput").value.trim();

const result = document.getElementById("result");

const found = encryptedData.find(x => x.imei === imei);

result.style.display = "block";

if(found){
result.className = "result bad";
result.innerHTML = `
<h2>⚠ Телефон найден в базе украденных</h2>
<br>
<b>Модель:</b> ${found.model}<br>
<b>IMEI:</b> ${found.imei}<br><br>
Рекомендуется дополнительная проверка устройства.
`;
} else {
result.className = "result good";
result.innerHTML = `
<h2>✓ Совпадений не найдено</h2>
<br>
Устройство отсутствует в текущей базе.
`;
}
}
